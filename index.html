  if(/tab|bar|victory lap|riviere|vulcan gas|maggie mae|cabana club|chapter tab|back to school tab|back 2 school tab|pre ohio st tab|pre arkansas tab/.test(n))return'bar';

  if(/parents weekend|parent|alumni weekend|family/.test(n))return'parents';

  if(/late night|latenight|party|disco|boiler room|shipwreck|vegas|pirates|olympus|casino|y2ka|haunted|halloween|jungle|catalina|rodeo|stampede|island|80's|80s|time travel|oktoberfest|wurstfest|hugs|duck hunt|margaritaville|shoreditch|cold|cactus social|fall '26|fall '25|fundraising event|bid day|bid-day|back to school party|back 2 school party|welcome night|theme night/.test(n))return'party';

  if(e.frat==='Holiday')return'holiday';
  return'other';
}
function allEvents(){return remoteEvents.length?remoteEvents:BUNDLED_EVENTS}
function chips(){filters.innerHTML='';let a=document.createElement('button');a.className='chip '+(activeFrat==='All'?'active':'');a.textContent='All';a.onclick=()=>{activeFrat='All';chips();render()};filters.appendChild(a);frats.forEach(f=>{let b=document.createElement('button');b.className='chip '+(activeFrat===f?'active':'');b.textContent=f;b.onclick=()=>{activeFrat=f;chips();render()};filters.appendChild(b)})}

function parseTimeMinutes(t){
  if(!t)return null;
  const m=String(t).trim().match(/(\d{1,2})(?::(\d{2}))?\s*(AM|PM)/i);
  if(!m)return null;
  let h=Number(m[1]),min=Number(m[2]||0),ap=m[3].toUpperCase();
  if(ap==='PM'&&h!==12)h+=12;
  if(ap==='AM'&&h===12)h=0;
  return h*60+min;
}
function dayOrder(e){
  const n=(e.name||'').toLowerCase();
  const explicit=parseTimeMinutes(e.time);
  if(explicit!==null)return explicit;

  if(/breakfast|morning/.test(n))return 9*60;
  if(/tailgate/.test(n))return 13*60;
  if(/watch party|game|football|home|away @|away$/.test(n))return 15*60;
  if(/parents weekend|alumni weekend|family/.test(n))return 16*60;
  if(/tab|bar|victory lap|riviere|vulcan gas|maggie mae|cabana club/.test(n))return 20*60;
  if(/formal|date event|date party|sweetheart|wedding/.test(n))return 21*60;
  if(/late night|latenight/.test(n))return 23*60+30;
  if(/party|disco|boiler room|shipwreck|vegas|pirates|olympus|casino|y2ka|haunted|halloween|jungle|catalina|rodeo|stampede|island|80's|80s|time travel|oktoberfest|wurstfest|hugs|duck hunt|margaritaville|shoreditch/.test(n))return 22*60+30;

  return 18*60;
}
function smartEventSort(a,b){
  const dc=a.date.localeCompare(b.date);
  if(dc!==0)return dc;
  const tc=dayOrder(a)-dayOrder(b);
  if(tc!==0)return tc;
  return a.frat.localeCompare(b.frat)||a.name.localeCompare(b.name);
}
function render(){let q=search.value.toLowerCase(),m=month.value,now=new Date(),start=new Date(now.getFullYear(),now.getMonth(),now.getDate());let arr=allEvents().filter(e=>D(e.end||e.date)>=start&&(e.frat==='Holiday'||activeFrat==='All'||eventFrats(e).includes(activeFrat))&&(m==='all'||String(D(e.date).getMonth())===m)&&(!q||`${e.name} ${e.frat} ${e.time||''}`.toLowerCase().includes(q))).sort(smartEventSort);calendar.innerHTML='';if(!arr.length){calendar.innerHTML='<p class="empty">No upcoming events match those filters.</p>';return}let groups={};arr.forEach(e=>{let k=D(e.date).toLocaleDateString(undefined,{month:'long',year:'numeric'});(groups[k]??=[]).push(e)});Object.entries(groups).forEach(([mn,items])=>{let sec=document.createElement('section');sec.className='month';sec.innerHTML=`<h2>${mn}</h2>`;let lw='',ld='';items.forEach(e=>{let d=D(e.date),w=wk(d);if(w!==lw){lw=w;ld='';let x=document.createElement('div');x.className='week';x.innerHTML=`<span>Week of ${wt(d)}</span>`;sec.appendChild(x)}if(e.date!==ld){ld=e.date;let x=document.createElement('div');x.className='dayhead';x.innerHTML=`<strong>${d.toLocaleDateString(undefined,{weekday:'long'})}</strong><span>${d.toLocaleDateString(undefined,{month:'long',day:'numeric'})}</span>`;sec.appendChild(x)}let r=document.createElement('article');r.className=`event ${eventColorClass(e)} ${e.date===today()?'today':''}`;r.dataset.date=e.date;let range=e.end?`${d.toLocaleDateString(undefined,{month:'short',day:'numeric'})}–${D(e.end).toLocaleDateString(undefined,{month:'short',day:'numeric'})}`:d.toLocaleDateString(undefined,{month:'short',day:'numeric'});r.innerHTML=`<div class="datebox"><div class="d">${d.getDate()}</div><div class="w">${d.toLocaleDateString(undefined,{weekday:'short'}).toUpperCase()}</div></div><div><h3>${e.frat==='Holiday'?e.name:`${fratTitleHTML(e)} — ${e.name}`}</h3><div class="meta">${range}${e.time?' • '+e.time:''}</div></div>`;sec.appendChild(r)});calendar.appendChild(sec)})}
search.oninput=render;month.onchange=render;document.getElementById('todayBtn').onclick=()=>{month.value='all';search.value='';activeFrat='All';chips();render();let el=[...document.querySelectorAll('.event')].find(x=>x.dataset.date===today());if(el)el.scrollIntoView({behavior:'smooth',block:'center'})};
function showLogin(){document.getElementById('loginPanel').classList.remove('hidden');document.getElementById('editorPanel').classList.add('hidden')} function showEditor(){document.getElementById('loginPanel').classList.add('hidden');document.getElementById('editorPanel').classList.remove('hidden');adminList()}
document.getElementById('adminBtn').onclick=()=>document.getElementById('modal').classList.remove('hidden');document.getElementById('close').onclick=()=>document.getElementById('modal').classList.add('hidden');
async function init(){if(!window.SUPABASE_URL||window.SUPABASE_URL.includes('YOUR_'))return;sb=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);await load();let {data:{session}}=await sb.auth.getSession();isAdmin=!!(session&&session.user?.email===window.ADMIN_EMAIL);isAdmin?showEditor():showLogin()}
async function load(){if(!sb)return;let {data,error}=await sb.from('events').select('*').order('date',{ascending:true});if(!error&&data&&data.length){remoteEvents=data.map(e=>({id:e.id,date:e.date,end:e.end_date||undefined,frat:e.frat,name:e.name,time:e.time||undefined,category:e.category||undefined}));render();if(isAdmin)adminList()}}
document.getElementById('login').onclick=async()=>{let s=document.getElementById('loginStatus');if(!sb){s.textContent='Online editing is not configured yet. See SETUP.txt.';return}let email=document.getElementById('email').value.trim(),password=document.getElementById('password').value,{data,error}=await sb.auth.signInWithPassword({email,password});if(error){s.textContent=error.message;return}if(data.user?.email!==window.ADMIN_EMAIL){await sb.auth.signOut();s.textContent='This is not the admin account.';return}isAdmin=true;showEditor()}
document.getElementById('logout').onclick=async()=>{if(sb)await sb.auth.signOut();isAdmin=false;showLogin()}
document.getElementById('save').onclick=async()=>{let s=document.getElementById('editorStatus');if(!sb||!isAdmin){s.textContent='Sign in as admin first.';return}let date=document.getElementById('date').value,name=document.getElementById('name').value.trim(),frat=document.getElementById('frat').value,joint=document.getElementById('jointFrat').value,category=document.getElementById('category').value,timeRaw=document.getElementById('time').value;if(joint&&joint!==frat)frat=frat+' + '+joint;if(!date||!name){s.textContent='Add a date and event name.';return}let time='';if(timeRaw){let [h,m]=timeRaw.split(':').map(Number),ap=h>=12?'PM':'AM';h=h%12||12;time=`${h}:${String(m).padStart(2,'0')} ${ap}`}let {error}=await sb.from('events').insert([{date,frat,name,time,category}]);if(error){s.textContent=error.message;return}s.textContent='Saved — everyone will see it.';document.getElementById('name').value='';document.getElementById('date').value='';document.getElementById('time').value='';await load()}
async function adminList(){let box=document.getElementById('adminList');if(!isAdmin||!remoteEvents.length){box.innerHTML='';return}box.innerHTML='<h3 style="font-size:13px">Online events</h3>'+remoteEvents.map(e=>`<div class="admin-item"><div><strong style="font-size:11px">${e.name}</strong><br><span>${e.frat} · ${e.date}</span></div><button class="danger" onclick="del('${e.id}')">Delete</button></div>`).join('')}
async function del(id){if(!sb||!isAdmin)return;let {error}=await sb.from('events').delete().eq('id',id);if(error){alert(error.message);return}await load()}
chips();render();init();
